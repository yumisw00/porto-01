<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="Alex Rivera - Professional Web Developer Portfolio. Crafting digital experiences with liquid glass aesthetics." />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Alex Rivera | Creative Web Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Critical CSS - inline untuk memastikan konten selalu visible */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: rgba(255, 255, 255, 0.95);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 212, 255, 0.2);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fallback content styles - memastikan konten visible sebelum React load */
    #root {
      position: relative;
      z-index: 10;
    }
    .fallback-content {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .fallback-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(0,212,255,0.8) 50%, rgba(123,47,247,0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    .fallback-subtitle {
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2rem;
    }
    .fallback-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .fallback-btn {
      padding: 14px 32px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      color: rgba(255, 255, 255, 0.95);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .fallback-btn:hover {
      border-color: rgba(0, 212, 255, 0.4);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loader"></div>
  </div>

  <div id="root">
    <!-- Fallback content - akan di-replace oleh React saat mount -->
    <div class="fallback-content">
      <h1 class="fallback-title">Alex Rivera</h1>
      <p class="fallback-subtitle">Crafting Digital Experiences</p>
      <div class="fallback-buttons">
        <a href="#portfolio" class="fallback-btn">View My Work</a>
        <a href="#contact" class="fallback-btn">Get In Touch</a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Hide loading screen setelah React mount atau setelah timeout
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var loader = document.getElementById('loading-screen');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function() { loader.remove(); }, 500);
        }
      }, 300);
    });

    // Fallback: jika React gagal load, tetap hide loading screen
    setTimeout(function() {
      var loader = document.getElementById('loading-screen');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        setTimeout(function() { loader.remove(); }, 500);
      }
    }, 3000);
  </script>
</body>
</html>
